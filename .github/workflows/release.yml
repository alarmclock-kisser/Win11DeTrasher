name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build Win11DeTrasher.slnx --configuration Release

      - name: Run tests
        run: dotnet test Win11DeTrasher.Tests/Win11DeTrasher.Tests.csproj --configuration Release --no-build

      - name: Publish self-contained single-file executable
        shell: pwsh
        run: >-
          dotnet publish Win11DeTrasher/Win11DeTrasher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=1.0.${{ github.run_number }}

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.$env:GITHUB_RUN_NUMBER"
          $executable = "artifacts/publish/Win11DeTrasher.exe"
          $configuration = "artifacts/publish/appsettings.json"

          if (-not (Test-Path $executable)) {
            throw "Published executable not found: $executable"
          }
          if (-not (Test-Path $configuration)) {
            throw "Published logger configuration not found: $configuration"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $executable $configuration --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $tag $executable $configuration --repo $env:GITHUB_REPOSITORY `
              --title "Win11DeTrasher $tag" --generate-notes
          }
